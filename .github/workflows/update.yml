name: Update data, notify, deploy

on:
  schedule:
    - cron: '*/5 * * * *'     # هر ۵ دقیقه (کوتاه‌ترین فاصلهٔ مجاز در GitHub)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['state/**', 'README.md']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch matches and news
        run: node scripts/fetch-data.mjs
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}

      - name: Fetch news and translate (Gemini)
        run: node scripts/news.mjs
        continue-on-error: true       # اگر Gemini/RSS خطا داد، بقیهٔ کارها ادامه پیدا کند
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Send Telegram alerts
        run: node scripts/notify.mjs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Save notification state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: state"
            git pull --rebase origin main
            git push
          fi

      - name: Build site
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
