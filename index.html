<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>پیدا | PEYDA</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #F3F4F6;
  --text-main: #1F2937;
  --text-muted: #6B7280;
  --primary: #00B894;
  --primary-dark: #006644;
  --accent: #A7E22E;
}
body {
  background-color: var(--bg);
  color: var(--text-main);
  font-family: 'Vazirmatn', sans-serif;
  -webkit-tap-highlight-color: transparent;
  margin: 0;
  padding-bottom: 80px;
}
/* Neumorphism Classes */
.neu-flat {
  background: var(--bg);
  box-shadow: 6px 6px 12px #d1d5db, -6px -6px 12px #ffffff;
}
.neu-pressed {
  background: var(--bg);
  box-shadow: inset 4px 4px 8px #d1d5db, inset -4px -4px 8px #ffffff;
}
.neu-btn {
  background: var(--bg);
  box-shadow: 4px 4px 8px #d1d5db, -4px -4px 8px #ffffff;
  transition: all 0.2s ease;
}
.neu-btn:active {
  box-shadow: inset 4px 4px 8px #d1d5db, inset -4px -4px 8px #ffffff;
}
.neu-primary {
  background: var(--primary);
  color: white;
  box-shadow: 4px 4px 8px #d1d5db, -4px -4px 8px #ffffff;
}
.neu-primary:active {
  box-shadow: inset 4px 4px 8px #009776, inset -4px -4px 8px #00d9b1;
}
/* Hide Scrollbar */
::-webkit-scrollbar { display: none; }
</style>
</head>
<body class="antialiased">

<!-- Header -->
<header class="sticky top-0 z-50 px-4 py-3" style="background: rgba(243, 244, 246, 0.9); backdrop-filter: blur(10px);">
  <div class="flex items-center justify-between mb-3">
    <div class="flex items-center gap-2">
      <div class="w-10 h-10 rounded-full flex items-center justify-center neu-flat">
        <svg class="w-6 h-6 text-[var(--primary-dark)]" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
      </div>
      <h1 class="text-xl font-bold text-[var(--primary-dark)]">پیدا</h1>
    </div>
    <button class="neu-btn px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-1 text-[var(--text-muted)]">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
      فیلتر
    </button>
  </div>
  <!-- Search Bar -->
  <div class="neu-pressed rounded-2xl flex items-center px-4 py-3">
    <svg class="w-5 h-5 text-[var(--text-muted)] ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
    <input type="text" placeholder="جستجو در اعلان ها..." class="bg-transparent border-none outline-none w-full text-sm text-[var(--text-main)] placeholder-[var(--text-muted)]">
  </div>
</header>

<main class="px-4 mt-2">
  <!-- Categories -->
  <div class="flex gap-4 overflow-x-auto pb-4 pt-2">
    <button class="flex flex-col items-center gap-2 min-w-[64px]">
      <div class="w-14 h-14 rounded-2xl neu-flat flex items-center justify-center text-[var(--primary)]">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      </div>
      <span class="text-xs text-[var(--text-main)]">خانه و املاک</span>
    </button>
    <button class="flex flex-col items-center gap-2 min-w-[64px]">
      <div class="w-14 h-14 rounded-2xl neu-flat flex items-center justify-center text-[var(--primary)]">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
      </div>
      <span class="text-xs text-[var(--text-main)]">موتر</span>
    </button>
    <button class="flex flex-col items-center gap-2 min-w-[64px]">
      <div class="w-14 h-14 rounded-2xl neu-flat flex items-center justify-center text-[var(--primary)]">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
      </div>
      <span class="text-xs text-[var(--text-main)]">موبایل و تبلت</span>
    </button>
    <button class="flex flex-col items-center gap-2 min-w-[64px]">
      <div class="w-14 h-14 rounded-2xl neu-flat flex items-center justify-center text-[var(--primary)]">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
      </div>
      <span class="text-xs text-[var(--text-main)]">کامپیوتر</span>
    </button>
  </div>

  <!-- Ads List -->
  <div class="flex items-center justify-between mt-2 mb-3">
    <h2 class="text-lg font-bold text-[var(--text-main)]">آخرین آگهی‌ها</h2>
    <span class="text-sm text-[var(--primary)] font-medium">مشاهده همه</span>
  </div>

  <div class="flex flex-col gap-4">
    <!-- Ad Card 1 -->
    <div class="neu-flat rounded-2xl p-3 flex gap-3 relative">
      <div class="w-24 h-24 rounded-xl bg-gray-300 flex-shrink-0 overflow-hidden relative">
        <img src="https://images.unsplash.com/photo-1560518883-ce09059eeffa?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="House" class="w-full h-full object-cover">
        <span class="absolute top-1 right-1 bg-[var(--primary)] text-white text-[10px] px-1.5 py-0.5 rounded-md">فوری</span>
      </div>
      <div class="flex flex-col justify-between flex-grow py-1">
        <div>
          <h3 class="font-bold text-sm text-[var(--text-main)] mb-1">فروش خانه دو نمره در کابل</h3>
          <p class="text-xs text-[var(--text-muted)]">کابل، ناحیه ۴</p>
        </div>
        <div class="flex justify-between items-end mt-2">
          <span class="font-bold text-sm text-[var(--primary-dark)]">۵,۵۰۰,۰۰۰ افغانی</span>
          <!-- Changed Heart to Bookmark -->
          <button class="w-8 h-8 rounded-full neu-btn flex items-center justify-center text-gray-400 hover:text-[var(--primary)] active:text-[var(--primary)] bookmark-btn">
            <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Ad Card 2 -->
    <div class="neu-flat rounded-2xl p-3 flex gap-3 relative">
      <div class="w-24 h-24 rounded-xl bg-gray-300 flex-shrink-0 overflow-hidden relative">
        <img src="https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Car" class="w-full h-full object-cover">
        <span class="absolute top-1 right-1 bg-[var(--accent)] text-gray-800 text-[10px] px-1.5 py-0.5 rounded-md">جدید</span>
      </div>
      <div class="flex flex-col justify-between flex-grow py-1">
        <div>
          <h3 class="font-bold text-sm text-[var(--text-main)] mb-1">فروش تویوتا کرولا ۲۰۱۹</h3>
          <p class="text-xs text-[var(--text-muted)]">هرات، ناحیه ۲</p>
        </div>
        <div class="flex justify-between items-end mt-2">
          <span class="font-bold text-sm text-[var(--primary-dark)]">۱,۸۵۰,۰۰۰ افغانی</span>
          <button class="w-8 h-8 rounded-full neu-btn flex items-center justify-center text-gray-400 hover:text-[var(--primary)] active:text-[var(--primary)] bookmark-btn">
            <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 z-50 px-4 pb-4">
  <div class="neu-flat rounded-3xl flex justify-between items-center px-6 py-3" style="background: rgba(243, 244, 246, 0.95); backdrop-filter: blur(10px);">
    <button class="flex flex-col items-center gap-1 text-[var(--primary)]">
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
      <span class="text-[10px] font-medium">خانه</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-[var(--text-muted)] hover:text-[var(--primary)] transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
      <span class="text-[10px] font-medium">آگهی‌های من</span>
    </button>
    <!-- Post Ad Button -->
    <div class="-mt-8">
      <button class="w-14 h-14 rounded-full neu-primary flex items-center justify-center">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      </button>
    </div>
    <button class="flex flex-col items-center gap-1 text-[var(--text-muted)] hover:text-[var(--primary)] transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
      <span class="text-[10px] font-medium">پیام‌ها</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-[var(--text-muted)] hover:text-[var(--primary)] transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span class="text-[10px] font-medium">پروفایل</span>
    </button>
  </div>
</nav>

<script>
// Initialize Telegram WebApp
if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

// Bookmark Toggle Logic
document.querySelectorAll('.bookmark-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const icon = this.querySelector('svg');
    const isActive = this.classList.contains('text-[var(--primary)]');
    
    if (isActive) {
      this.classList.remove('text-[var(--primary)]');
      this.classList.add('text-gray-400');
      icon.setAttribute('fill', 'none');
    } else {
      this.classList.remove('text-gray-400');
      this.classList.add('text-[var(--primary)]');
      icon.setAttribute('fill', 'currentColor');
    }
  });
});
</script>
</body>
</html>
