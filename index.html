<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دیوار | DivarAf</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg: #e3e8ef;
            --shadow-dark: #b9c1cf;
            --shadow-light: #ffffff;
            --icon: #8791a5;
            --blue: #2f80ff;
            --gold: #fcc419;
            --gold-soft: #ffe066;
        }

        body { font-family: 'Vazirmatn', sans-serif; background-color: var(--bg); user-select: none; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ---------- هدر و دسته‌بندی‌ها (هماهنگ با سبک نئومورفیک) ---------- */
        header.sticky { background: var(--bg) !important; box-shadow: 0 8px 18px -8px var(--shadow-dark) !important; }
        header button {
            width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%;
            background: var(--bg); color: var(--icon);
            box-shadow: 4px 4px 9px var(--shadow-dark), -4px -4px 9px var(--shadow-light);
            transition: box-shadow .2s, color .2s;
        }
        header button:active { box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light); color: var(--blue); }
        #searchBox { background: var(--bg) !important; }
        .category-circle {
            width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; border-radius: 50%;
            background: var(--bg); font-size: 26px;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
        }

        /* ---------- bottom nav ---------- */
        .nav-bar {
            position: fixed; left: 0; right: 0; margin: 0 auto;
            bottom: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            width: 92%; max-width: 400px; box-sizing: border-box; padding: 12px 14px;
            display: flex; flex-direction: row; align-items: center; justify-content: space-between;
            background: #e3e8ef; border-radius: 34px; z-index: 50;
            box-shadow: 14px 14px 28px #b9c1cf, -12px -12px 26px #ffffff;
        }

        .nav-btn {
            position: relative; width: 58px; height: 58px; flex: 0 0 58px; margin: 0; padding: 0;
            display: flex; align-items: center; justify-content: center;
            -webkit-appearance: none; appearance: none; border: 0; border-radius: 50%;
            background: #e3e8ef; color: #8791a5; cursor: pointer; outline: none;
            box-shadow: 6px 6px 13px #b9c1cf, -6px -6px 13px #ffffff;
            transition: color .3s, box-shadow .3s, transform .2s;
        }
        .nav-btn svg { position: relative; z-index: 3; width: 25px; height: 25px; display: block; transition: transform .3s; }
        .nav-btn:active { transform: scale(.94); }

        .nav-btn.tab-active { color: #2f80ff; font-weight: normal; }
        .nav-btn.tab-inactive { color: #8791a5; }
        .nav-btn::after {
            content: ""; position: absolute; bottom: 7px; left: 26px; width: 6px; height: 6px;
            border-radius: 50%; background: #2f80ff; z-index: 3;
            opacity: 0; transform: scale(0); transition: opacity .3s, transform .3s;
        }
        .nav-btn.tab-active::after { opacity: 1; transform: scale(1); }
        .nav-btn.tab-active svg { transform: translateY(-2px); }

        /* water: clipped to the circle (the mask fixes the iOS Safari clipping bug) */
        .water {
            position: absolute; top: 0; right: 0; bottom: 0; left: 0;
            border-radius: 50%; overflow: hidden; pointer-events: none; z-index: 1;
            opacity: 0; transition: opacity .35s;
            -webkit-mask-image: -webkit-radial-gradient(white, black);
            -webkit-transform: translateZ(0); transform: translateZ(0);
        }
        .water::before {
            content: ""; position: absolute; left: -50%; top: 108%;
            width: 200%; height: 200%; border-radius: 41%;
            background: linear-gradient(180deg, #ffe066, #fcc419);
            transition: top 1s cubic-bezier(.3, .7, .3, 1);
            animation: waveMove 2s linear infinite;
        }
        @keyframes waveMove {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .water i {
            position: absolute; bottom: -8px; width: 7px; height: 7px; border-radius: 50%;
            background: rgba(255,255,255,.75); opacity: 0;
        }
        .water i:nth-child(1) { left: 22%; }
        .water i:nth-child(2) { left: 52%; width: 5px; height: 5px; animation-delay: .4s !important; }
        .water i:nth-child(3) { left: 72%; width: 6px; height: 6px; animation-delay: .8s !important; }
        @keyframes bubbleUp {
            0%   { transform: translateY(0) scale(.6); opacity: 0; }
            25%  { opacity: .9; }
            100% { transform: translateY(-46px) scale(1.1); opacity: 0; }
        }

        .nav-btn:active .water,
        .nav-btn.splash .water { opacity: .95; }
        .nav-btn:active .water::before,
        .nav-btn.splash .water::before { top: 22%; }
        .nav-btn:active .water i,
        .nav-btn.splash .water i { animation: bubbleUp 1.2s ease-in infinite; }

        .nav-btn:active, .nav-btn.splash {
            color: #ffffff;
            box-shadow: 0 0 22px rgba(252, 196, 25, .55), 6px 6px 13px #b9c1cf, -6px -6px 13px #ffffff;
        }
        .nav-btn:active::after, .nav-btn.splash::after { background: #ffffff; }

        @media (prefers-reduced-motion: reduce) {
            .water::before, .water i { animation: none !important; }
            .nav-btn, .nav-btn svg, .water::before { transition: none; }
        }
    </style>
</head>
<body class="pb-32 text-gray-800">

    <header class="bg-white shadow-sm sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
        <h1 class="text-xl font-bold text-gray-800">دیوار | DivarAf</h1>
        <button onclick="toggleSearch()" aria-label="جستجو" class="p-2 text-gray-500 hover:bg-gray-100 rounded-full transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </button>
    </header>

    <div id="searchBox" class="hidden bg-white px-4 pb-3 shadow-sm fade-in">
        <div class="relative">
            <input type="text" id="searchInput" placeholder="جستجو در اعلان‌ها..." class="w-full bg-gray-100 rounded-xl py-3 px-4 pr-10 outline-none focus:ring-2 focus:ring-red-400 transition">
            <button onclick="searchAds()" class="absolute right-3 top-3 text-gray-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </button>
        </div>
    </div>

    <main id="homePage" class="fade-in">
        <div class="px-4 py-4">
            <h2 class="text-sm font-bold text-gray-700 mb-3">دسته‌بندی‌ها</h2>
            <div class="flex gap-4 overflow-x-auto pb-4 pt-1 px-1 hide-scroll" id="categoriesContainer"></div>
        </div>
        <div class="px-4 pb-4">
            <h2 class="text-sm font-bold text-gray-700 mb-3">جدیدترین اعلان‌ها</h2>
            <div id="adsList" class="space-y-3"><p class="text-center text-gray-500 py-4">در حال بارگذاری...</p></div>
        </div>
    </main>

    <main id="createPage" class="hidden px-4 py-4 fade-in">
        <h2 class="text-lg font-bold mb-4 text-center">ثبت اعلان جدید</h2>
        <form id="createForm" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-600 mb-1">عنوان اعلان</label>
                <input type="text" id="adTitle" required class="w-full bg-white rounded-xl p-3 shadow-sm outline-none focus:ring-2 focus:ring-red-400">
            </div>
            
            <div class="bg-white p-3 rounded-xl shadow-sm flex items-center justify-between">
                <span class="text-sm font-bold text-gray-700">قابل معاوضه است؟</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="adBarter" class="sr-only peer" onchange="togglePriceInput()">
                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-500"></div>
                </label>
            </div>

            <div id="priceContainer">
                <label class="block text-sm text-gray-600 mb-1">قیمت (افغانی - 0 برای قابل مذاکره)</label>
                <input type="number" id="adPrice" class="w-full bg-white rounded-xl p-3 shadow-sm outline-none focus:ring-2 focus:ring-red-400">
            </div>

            <div>
                <label class="block text-sm text-gray-600 mb-1">دسته‌بندی</label>
                <select id="adCategory" class="w-full bg-white rounded-xl p-3 shadow-sm outline-none focus:ring-2 focus:ring-red-400">
                    <!-- Rendered by JS -->
                </select>
            </div>

            <!-- ⭐ فیلد جدید: انتخاب ولایت -->
            <div>
                <label class="block text-sm text-gray-600 mb-1">ولایت</label>
                <select id="adProvince" class="w-full bg-white rounded-xl p-3 shadow-sm outline-none focus:ring-2 focus:ring-red-400">
                    <!-- Rendered by JS -->
                </select>
            </div>

            <div>
                <label class="block text-sm text-gray-600 mb-1">توضیحات</label>
                <textarea id="adDesc" required rows="3" class="w-full bg-white rounded-xl p-3 shadow-sm outline-none focus:ring-2 focus:ring-red-400"></textarea>
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-red-500 text-white rounded-xl py-3 font-bold shadow-lg shadow-red-500/30 active:scale-95 transition">ثبت اعلان</button>
        </form>
    </main>

    <main id="profilePage" class="hidden px-4 py-4 fade-in">
        <div class="bg-white rounded-2xl p-6 shadow-sm text-center mb-6 flex flex-col items-center relative overflow-hidden">
            <img id="profileImg" src="" alt="Profile" class="w-20 h-20 rounded-full mb-3 object-cover border-2 border-red-500 hidden shadow-md">
            <div id="profileDefaultImg" class="w-20 h-20 bg-red-100 text-red-500 rounded-full flex items-center justify-center text-2xl font-bold mb-3 shadow-md">?</div>
            <h2 class="font-bold text-lg" id="profileName">کاربر</h2>
            <p class="text-sm text-gray-500 mt-1" id="profileStats">در حال بارگذاری...</p>
        </div>
        <h3 class="text-sm font-bold text-gray-700 mb-3">مدیریت اعلان‌های من</h3>
        <div id="myAdsList" class="space-y-3"></div>
    </main>

    <!-- ===== نوار ناوبری جدید (ساختار و توابع قبلی حفظ شده؛ آیدی تب‌ها همان است) ===== -->
    <nav class="nav-bar" dir="ltr" style="position:fixed;left:0;right:0;bottom:14px;margin:0 auto;width:92%;max-width:400px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;">
        <button onclick="switchTab('home')" id="tab-home" aria-label="خانه" class="nav-btn tab-active" type="button">
            <span class="water" style="position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;overflow:hidden;pointer-events:none;"><i></i><i></i><i></i></span>
            <!-- خانه -->
            <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        </button>

        <button onclick="openSearch()" id="tab-search" aria-label="جستجو" class="nav-btn tab-inactive" type="button">
            <span class="water" style="position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;overflow:hidden;pointer-events:none;"><i></i><i></i><i></i></span>
            <!-- جستجو -->
            <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        </button>

        <button onclick="switchTab('create')" id="tab-create" aria-label="ثبت اعلان" class="nav-btn tab-inactive" type="button">
            <span class="water" style="position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;overflow:hidden;pointer-events:none;"><i></i><i></i><i></i></span>
            <!-- ثبت اعلان -->
            <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>

        <button onclick="switchTab('profile')" id="tab-profile" aria-label="پروفایل" class="nav-btn tab-inactive" type="button">
            <span class="water" style="position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;overflow:hidden;pointer-events:none;"><i></i><i></i><i></i></span>
            <!-- پروفایل -->
            <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>
        </button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        const tgUser = tg.initDataUnsafe.user;

        if (tgUser && tgUser.photo_url) {
            document.getElementById('profileImg').src = tgUser.photo_url;
            document.getElementById('profileImg').classList.remove('hidden');
            document.getElementById('profileDefaultImg').classList.add('hidden');
        } else if (tgUser && tgUser.first_name) {
            document.getElementById('profileDefaultImg').innerText = tgUser.first_name[0];
        }

        const CATEGORIES = [
            { id: 1, name: 'لوازم خانه', icon: '🏠' }, { id: 2, name: 'الکترونیک', icon: '📱' },
            { id: 3, name: 'وسایل نقلیه', icon: '🚗' }, { id: 4, name: 'املاک', icon: '🏢' }, { id: 5, name: 'خدمات', icon: '🛠️' }
        ];

        // ⭐ لیست ۳۴ ولایت افغانستان
        const PROVINCES = [
            { code: 'KBL', name: 'کابل' }, { code: 'HRT', name: 'هرات' }, { code: 'BLK', name: 'بلخ' }, { code: 'KDZ', name: 'کندز' },
            { code: 'BDG', name: 'بادغیس' }, { code: 'BGL', name: 'بغلان' }, { code: 'BAM', name: 'بامیان' }, { code: 'DAY', name: 'دایکندی' },
            { code: 'FRA', name: 'فراه' }, { code: 'FYB', name: 'فاریاب' }, { code: 'GHA', name: 'غزنی' }, { code: 'GHO', name: 'غور' },
            { code: 'HEL', name: 'هلمند' }, { code: 'JOW', name: 'جوزجان' }, { code: 'KAN', name: 'قندهار' }, { code: 'KAP', name: 'کاپیسا' },
            { code: 'KHO', name: 'خوست' }, { code: 'KNR', name: 'کنر' }, { code: 'LAG', name: 'لغمان' }, { code: 'LOG', name: 'لوگر' },
            { code: 'NAN', name: 'ننگرهار' }, { code: 'NIM', name: 'نیمروز' }, { code: 'NUR', name: 'نورستان' }, { code: 'ORU', name: 'اروزگان' },
            { code: 'PAN', name: 'پنجشیر' }, { code: 'PAR', name: 'پروان' }, { code: 'PIA', name: 'پکتیا' }, { code: 'PKA', name: 'پکتیکا' },
            { code: 'SAM', name: 'سمنگان' }, { code: 'SAR', name: 'سرپل' }, { code: 'TAK', name: 'تخار' }, { code: 'WAR', name: 'میدان وردک' },
            { code: 'ZAB', name: 'زابل' }, { code: 'URZ', name: 'اورزگان' }
        ];

        function init() {
            renderCategories();
            populateSelects();
            loadAds();
            initNavWater();
        }

        // انیمیشن آب: با هر کلیک چند لحظه دکمه پر از آب می‌شود
        function initNavWater() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    btn.classList.add('splash');
                    clearTimeout(btn._t);
                    btn._t = setTimeout(() => btn.classList.remove('splash'), 1400);
                });
            });
        }

        function renderCategories() {
            document.getElementById('categoriesContainer').innerHTML = CATEGORIES.map(c => `
                <div class="flex flex-col items-center gap-2 cursor-pointer active:scale-95 transition" onclick="filterCategory(${c.id})">
                    <div class="category-circle">${c.icon}</div>
                    <span class="text-xs text-gray-600 whitespace-nowrap">${c.name}</span>
                </div>
            `).join('');
        }

        function populateSelects() {
            document.getElementById('adCategory').innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            document.getElementById('adProvince').innerHTML = PROVINCES.map(p => `<option value="${p.code}">${p.name}</option>`).join('');
        }

        function switchTab(tab) {
            ['home', 'create', 'profile'].forEach(t => {
                document.getElementById(`${t}Page`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('tab-active');
                document.getElementById(`tab-${t}`).classList.add('tab-inactive');
            });
            document.getElementById(`${tab}Page`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
            document.getElementById(`tab-${tab}`).classList.remove('tab-inactive');
            if (tab === 'home') loadAds();
            if (tab === 'profile') loadProfile();
        }

        function toggleSearch() { document.getElementById('searchBox').classList.toggle('hidden'); }

        // دکمه جستجوی نوار پایین: رفتن به خانه و باز کردن کادر جستجو
        function openSearch() {
            switchTab('home');
            const box = document.getElementById('searchBox');
            box.classList.remove('hidden');
            document.getElementById('searchInput').focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function togglePriceInput() {
            const isBarter = document.getElementById('adBarter').checked;
            document.getElementById('priceContainer').style.display = isBarter ? 'none' : 'block';
        }

        async function callServerless(method, data = {}) {
            return new Promise((resolve, reject) => {
                tg.Serverless.call(method, data, (err, res) => { if (err) reject(err); else resolve(res); });
            });
        }

        async function loadAds(categoryId = null, searchText = null) {
            const list = document.getElementById('adsList');
            list.innerHTML = '<p class="text-center text-gray-500 py-4">در حال بارگذاری...</p>';
            try {
                const data = { limit: 20 };
                if (categoryId) data.categoryId = categoryId;
                if (searchText) data.search = searchText;

                const res = await callServerless('getAds', data);
                if (!res || !res.ads || res.ads.length === 0) {
                    list.innerHTML = '<p class="text-center text-gray-500 py-4">هیچ اعلانی یافت نشد.</p>';
                    return;
                }

                list.innerHTML = res.ads.map(ad => `
                    <div class="bg-white p-3 rounded-2xl shadow-sm flex items-center gap-3 active:scale-[0.98] transition cursor-pointer">
                        <div class="w-20 h-20 bg-gray-100 rounded-xl flex items-center justify-center text-2xl flex-shrink-0">
                            ${ad.categoryIcon || '📦'}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-gray-800 text-sm truncate">${ad.title}</h3>
                            <p class="text-xs text-gray-500 mt-1 truncate">${ad.provinceName} • ${ad.categoryName}</p>
                            <p class="text-red-500 font-bold text-sm mt-1">${ad.isBarter ? '🔄 معاوضه' : (ad.price === 0 ? 'قابل مذاکره' : ad.price.toLocaleString() + ' افغانی')}</p>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                list.innerHTML = `<p class="text-center text-red-500 py-4">خطا در دریافت اطلاعات!</p>`;
            }
        }

        function filterCategory(id) { switchTab('home'); loadAds(id); }
        function searchAds() { const val = document.getElementById('searchInput').value; loadAds(null, val); }

        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'در حال ثبت...'; btn.disabled = true;

            try {
                const isBarter = document.getElementById('adBarter').checked;
                const res = await callServerless('createAd', {
                    title: document.getElementById('adTitle').value,
                    price: isBarter ? 0 : (parseInt(document.getElementById('adPrice').value) || 0),
                    categoryId: parseInt(document.getElementById('adCategory').value),
                    province: document.getElementById('adProvince').value, // ⭐ ارسال ولایت انتخاب شده
                    description: document.getElementById('adDesc').value,
                    isBarter: isBarter
                });

                if (res && res.success) {
                    tg.showAlert('🎉 اعلان شما ثبت و در کانال منتشر شد!');
                    e.target.reset();
                    togglePriceInput();
                    switchTab('home');
                }
            } catch (err) {
                tg.showAlert('خطا در ثبت: ' + (err.message || 'ارتباط برقرار نشد'));
            } finally {
                btn.innerText = 'ثبت اعلان'; btn.disabled = false;
            }
        });

        async function loadProfile() {
            try {
                const res = await callServerless('getProfile');
                if (res && res.success && res.user) {
                    document.getElementById('profileName').innerText = res.user.name || 'کاربر';
                    document.getElementById('profileStats').innerHTML = `📋 ${res.user.totalAds || 0} اعلان | 👥 ${res.user.invitedCount || 0} دعوت`;

                    const list = document.getElementById('myAdsList');
                    if (!res.ads || res.ads.length === 0) {
                        list.innerHTML = '<p class="text-center text-gray-500 text-sm py-4">شما هنوز اعلانی ثبت نکرده‌اید.</p>';
                    } else {
                        list.innerHTML = res.ads.map(ad => `
                            <div class="bg-white p-4 rounded-xl shadow-sm flex flex-col gap-2 mb-2">
                                <div class="flex justify-between items-center">
                                    <div>
                                        <h4 class="font-bold text-sm text-gray-800">${ad.title}</h4>
                                        <p class="text-xs text-gray-500 mt-1">👁 ${ad.views} بازدید | وضعیت: ${ad.status === 'active' ? 'فعال' : ad.status === 'sold' ? 'فروخته شده' : 'حذف شده'}</p>
                                    </div>
                                    <span class="text-xs px-2 py-1 rounded-md ${ad.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                                        ${ad.status === 'active' ? 'فعال' : 'غیرفعال'}
                                    </span>
                                </div>
                                ${ad.status === 'active' ? `
                                <div class="flex gap-2 mt-2">
                                    <button onclick="updateAd(${ad.id}, 'sold')" class="flex-1 bg-gray-100 text-gray-700 text-xs py-2 rounded-lg hover:bg-gray-200 transition">علامت فروخته شده</button>
                                    <button onclick="deleteAd(${ad.id})" class="flex-1 bg-red-50 text-red-600 text-xs py-2 rounded-lg hover:bg-red-100 transition">حذف اعلان</button>
                                </div>
                                ` : ''}
                            </div>
                        `).join('');
                    }
                }
            } catch (error) { tg.showAlert('خطا در دریافت پروفایل!'); }
        }

        async function updateAd(adId, status) {
            if (!confirm('آیا از تغییر وضعیت این اعلان مطمئن هستید؟')) return;
            try {
                await callServerless('updateAdStatus', { adId: adId, status: status });
                tg.showAlert('وضعیت اعلان با موفقیت تغییر کرد');
                loadProfile();
            } catch (e) { tg.showAlert('خطا: ' + e.message); }
        }

        async function deleteAd(adId) {
            if (!confirm('آیا از حذف این اعلان مطمئن هستید؟')) return;
            try {
                await callServerless('deleteAd', { adId: adId });
                tg.showAlert('اعلان با موفقیت حذف شد');
                loadProfile();
            } catch (e) { tg.showAlert('خطا: ' + e.message); }
        }

        init();
    </script>
</body>
</html>
